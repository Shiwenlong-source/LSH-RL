[project]
name = "lsh-rl"
version = "0.1.0"
description = "LSH-RL reproduction package built on a modified Agent-Lightning training framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "graphviz",
  "psutil",
  "gpustat",
  "setproctitle",
  "flask",
  "agentops>=0.4.13",
  "uvicorn",
  "fastapi",
  "aiohttp",
  "opentelemetry-api>=1.35",
  "opentelemetry-sdk>=1.35",
  "opentelemetry-exporter-otlp>=1.35",
  "litellm[proxy]>=1.74",
  "pydantic>=2.11",
  "openai",
  "rich",
  "portpicker",
  "gunicorn",
  "uvicorn_worker",
  "aiologic",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.8.0",
  "torchvision>=0.23.0",
  "transformers>=4.55.0,!=4.57.2",
  "vllm>=0.10.2,!=0.11.1,!=0.11.2,!=0.12.0",
  "litellm[proxy]>=1.78",
  "flash-attn>=2.8.3",
  "tensordict>=0.9.1",
  "verl>=0.6.0",
  "datasets",
  "peft",
]

[project.scripts]
agl = "agentlightning.cli:main"

[dependency-groups]
dev = [
  "pytest",
  "black",
  "isort",
  "pyright",
]

[tool.uv]
required-version = ">=0.9.9"
environments = [
  "sys_platform == 'linux'",
]
override-dependencies = [
  "packaging>=24.0",
  "websockets>=15.0.1",
  "rich>=13.9.4",
  "numpy>=2.0.0,<2.3.0",
  "setuptools>=80.9.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128" },
]
torchvision = [
  { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.extra-build-dependencies]
flash-attn = [
  { requirement = "torch", match-runtime = true },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentlightning"]
include = [
  "agentlightning/**/*.yaml",
  "agentlightning/**/*.yml",
  "agentlightning/**/*.poml",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/examples/**/logs/**",
  "/examples/**/records/**",
  "/examples/**/checkpoints/**",
  "/examples/**/.cache_uv/**",
  "/examples/**/.cache_xdg/**",
]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["agentlightning"]
